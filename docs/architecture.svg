<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
<rect width="1200" height="650" fill="#0d1524"/>
<style>text{font-family:Arial,sans-serif;fill:#edf3ff} .title{font-size:32px;font-weight:bold}.h{font-size:20px;font-weight:bold}.p{font-size:16px}.b{fill:#172a44;stroke:#557398;stroke-width:2}.a{stroke:#57c8fa;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#57c8fa"/></marker></defs>
<text x="45" y="55" class="title">Граф переводов → объяснимый приоритет проверки</text>
<text x="45" y="90" class="p">Локально • фиксированные версии • правила вместо выдуманных клиентских атрибутов</text>
<rect x="45" y="125" width="250" height="170" rx="14" class="b"/><text x="65" y="160" class="h">1. Parquet → проверки</text><text x="65" y="200" class="p">Узлы, рёбра, транзакции</text><text x="65" y="228" class="p">Схема, суммы, количество</text><text x="65" y="256" class="p">SHA-256 входных файлов</text>
<path d="M295,210 L335,210" class="a"/>
<rect x="345" y="125" width="250" height="170" rx="14" class="b"/><text x="365" y="160" class="h">2. Метрики и время</text><text x="365" y="200" class="p">Степени, суммы, seed-хопы</text><text x="365" y="228" class="p">FIFO: два сценария дат</text><text x="365" y="256" class="p">Обрыв и неполный вход</text>
<path d="M595,210 L635,210" class="a"/>
<rect x="645" y="125" width="250" height="170" rx="14" class="b"/><text x="665" y="160" class="h">3. Роли и сообщества</text><text x="665" y="200" class="p">Правила + сила признаков</text><text x="665" y="228" class="p">Louvain по компонентам</text><text x="665" y="256" class="p">Приоритет и объяснение</text>
<path d="M770,295 L770,345" class="a"/>
<rect x="645" y="355" width="480" height="180" rx="14" class="b"/><text x="665" y="390" class="h">4. Проверка гипотез и выдача</text><text x="665" y="425" class="p">Циклы, маршруты, аномалии, 14 сценариев порогов</text><text x="665" y="455" class="p">Удаление top-N и случайный контроль</text><text x="665" y="485" class="p">3 CSV + метрики + отчёт воспроизводимости</text>
<path d="M645,445 L605,445" class="a"/>
<rect x="45" y="355" width="550" height="180" rx="14" class="b"/><text x="65" y="390" class="h">5. Рабочее место аналитика</text><text x="65" y="425" class="p">Граф, поиск, направления, пути и локальный помощник</text><text x="65" y="455" class="p">Карточка, операции, история, запрос недостающих данных</text><text x="65" y="485" class="p">Справка HTML / JSON → ручная проверка специалистом</text>
<text x="45" y="590" class="h">Выход — проверяемые гипотезы. Роль и score не устанавливают виновность.</text>
<text x="45" y="620" class="p">Сеть ограничена одним банком, июлем 2026, 4 коленами и порогом 5000 KZT.</text>
</svg>
